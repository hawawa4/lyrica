[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
authors = ["me@hawawa.org"]

[[bin]]
name = "musepractice"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mp-core = { path = "../core", features = ["desktop-audio"] }
cpal = "0.15"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
