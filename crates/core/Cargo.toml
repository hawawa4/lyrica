[package]
name = "mp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
cv-barline = { path = "../cv-barline" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = "9.0.2"
quick-xml = "0.36"
blake3 = "1"
oxisynth = { version = "0.1.0", features = ["sf3"] }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
walkdir = "2.5.0"
ureq = { version = "3", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
desktop-audio = ["dep:cpal"]
# GitHub-release update check + in-place install (see `updater`).
updater = ["dep:ureq", "dep:sha2", "dep:tempfile"]

[dependencies.cpal]
version = "0.15"
optional = true
