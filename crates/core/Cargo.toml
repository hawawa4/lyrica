[package]
name = "mp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = "9.0.2"
quick-xml = "0.36"
blake3 = "1"
rustysynth = "1.3.7"
midly = { version = "0.5.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
desktop-audio = ["dep:cpal"]

[dependencies.cpal]
version = "0.15"
optional = true
